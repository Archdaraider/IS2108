<!-- Chat Widget Button -->
<div id="chatWidgetButton" class="chat-widget-btn" onclick="toggleChatWidget()">
    <i class="fas fa-comments"></i>
    <span id="chatUnreadBadge" class="chat-unread-badge" style="display: none;">0</span>
</div>

<!-- Chat Widget Modal -->
<div id="chatWidget" class="chat-widget-modal" style="display: none;">
    <div class="chat-widget-header">
        <div>
            <h4><i class="fas fa-headset"></i> Customer Support</h4>
            <small class="text-muted">We typically reply within minutes</small>
        </div>
        <button onclick="toggleChatWidget()" class="chat-close-btn">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="chat-widget-body">
        <!-- Welcome Screen (shown when no active chat) -->
        <div id="chatWelcome" class="chat-welcome">
            <div class="chat-welcome-content">
                <i class="fas fa-comments fa-3x mb-3" style="color: #3b82f6;"></i>
                <h5>Need Help?</h5>
                <p>Start a conversation with our support team!</p>
                <button onclick="startNewChat()" class="btn btn-primary">
                    <i class="fas fa-comment"></i> Start Chat
                </button>
            </div>
        </div>
        
        <!-- Chat Messages -->
        <div id="chatMessagesContainer" class="chat-messages-container" style="display: none;">
            <!-- Messages will be inserted here -->
        </div>
    </div>
    
    <div id="chatWidgetFooter" class="chat-widget-footer" style="display: none;">
        <form id="customerChatForm" onsubmit="sendCustomerMessage(event)">
            <div class="chat-input-group">
                <input 
                    type="text" 
                    id="customerMessageInput" 
                    class="chat-input" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                />
                <button type="submit" class="chat-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let currentChatId = null;
let messagePollingInterval = null;

// Check for existing chat on page load
document.addEventListener('DOMContentLoaded', function() {
    // First, try to load chat ID from localStorage
    const savedChatId = localStorage.getItem('aurora_chat_id');
    
    // Also check server for existing active chat (for logged-in users)
    fetch('/admin/api/chat/check/', {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success && data.has_chat) {
            currentChatId = data.chat_id;
            // Sync with localStorage
            localStorage.setItem('aurora_chat_id', currentChatId);
            console.log('Found existing chat ID from server:', currentChatId);
            
            // Show chat interface
            document.getElementById('chatWelcome').style.display = 'none';
            document.getElementById('chatMessagesContainer').style.display = 'flex';
            document.getElementById('chatWidgetFooter').style.display = 'block';
            
            // Load existing messages
            loadChatMessages();
        } else if (savedChatId) {
            // Fall back to localStorage if server doesn't have chat
            currentChatId = parseInt(savedChatId);
            console.log('Using chat ID from localStorage:', currentChatId);
            
            // Show chat interface
            document.getElementById('chatWelcome').style.display = 'none';
            document.getElementById('chatMessagesContainer').style.display = 'flex';
            document.getElementById('chatWidgetFooter').style.display = 'block';
            
            // Load existing messages
            loadChatMessages();
        }
    })
    .catch(error => {
        console.error('Error checking for existing chat:', error);
        // Fall back to localStorage
        if (savedChatId) {
            currentChatId = parseInt(savedChatId);
            console.log('Using chat ID from localStorage (fallback):', currentChatId);
            
            // Show chat interface
            document.getElementById('chatWelcome').style.display = 'none';
            document.getElementById('chatMessagesContainer').style.display = 'flex';
            document.getElementById('chatWidgetFooter').style.display = 'block';
            
            // Load existing messages
            loadChatMessages();
        }
    });
});

// Toggle chat widget - make it globally accessible
window.toggleChatWidget = function toggleChatWidget() {
    const widget = document.getElementById('chatWidget');
    if (!widget) {
        console.warn('Chat widget not found');
        return;
    }
    const isVisible = widget.style.display !== 'none';
    
    widget.style.display = isVisible ? 'none' : 'flex';
    
    if (!isVisible && currentChatId) {
        // Load messages when opening
        loadChatMessages();
        
        // Start polling for new messages
        if (messagePollingInterval) clearInterval(messagePollingInterval);
        messagePollingInterval = setInterval(loadChatMessages, 5000);
    } else {
        // Stop polling when closing
        if (messagePollingInterval) {
            clearInterval(messagePollingInterval);
            messagePollingInterval = null;
        }
    }
};

// Start a new chat
function startNewChat() {
    document.getElementById('chatWelcome').style.display = 'none';
    document.getElementById('chatMessagesContainer').style.display = 'flex';
    document.getElementById('chatWidgetFooter').style.display = 'block';
}

// Send customer message
function sendCustomerMessage(e) {
    e.preventDefault();
    
    const input = document.getElementById('customerMessageInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    const formData = new FormData();
    formData.append('message', message);
    if (currentChatId) {
        formData.append('chat_id', currentChatId);
    }
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
    
    // Disable input while sending
    input.disabled = true;
    
    fetch('/admin/api/chat/send/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            currentChatId = data.chat_id;
            // Save chat ID to localStorage for persistence
            localStorage.setItem('aurora_chat_id', currentChatId);
            console.log('Saved chat ID to localStorage:', currentChatId);
            
            input.value = '';
            addMessageToChat(data.message);
            
            // Start polling if not already started
            if (!messagePollingInterval) {
                messagePollingInterval = setInterval(loadChatMessages, 5000);
            }
        } else {
            alert('Error sending message: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to send message');
    })
    .finally(() => {
        input.disabled = false;
        input.focus();
    });
}

// Load chat messages
function loadChatMessages() {
    if (!currentChatId) return;
    
    fetch(`/admin/api/chat/${currentChatId}/messages/`, {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        return response.json();
    })
    .then(data => {
        // Handle unauthorized access - user doesn't own this chat
        if (data && (data.reset_chat || (data.success === false && data.error === 'Unauthorized'))) {
            console.log('Access denied to chat. Resetting chat state.');
            currentChatId = null;
            localStorage.removeItem('aurora_chat_id'); // Clear invalid chat ID
            // Try to check for a new chat
            checkForChat();
            return;
        }
        
        if (!data || !data.success) return; // Handle error cases
        
        if (data.success) {
            const container = document.getElementById('chatMessagesContainer');
            const previousScrollHeight = container.scrollHeight;
            const wasAtBottom = container.scrollTop + container.clientHeight >= previousScrollHeight - 50;
            
            container.innerHTML = '';
            
            data.messages.forEach(msg => {
                addMessageToChat(msg, false); // Don't auto-scroll for each message
            });
            
            // Only auto-scroll if user was at bottom or if it's the first load
            if (wasAtBottom || previousScrollHeight === 0) {
                container.scrollTop = container.scrollHeight;
            }
            
            // Update unread badge
            const widget = document.getElementById('chatWidget');
            const isWidgetOpen = widget.style.display !== 'none';
            const badge = document.getElementById('chatUnreadBadge');
            
            if (data.unread_count > 0 && !isWidgetOpen) {
                badge.textContent = data.unread_count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }
    })
    .catch(error => console.error('Error loading messages:', error));
}

// Add message to chat UI
function addMessageToChat(message, autoScroll = true) {
    const container = document.getElementById('chatMessagesContainer');
    const messageDiv = document.createElement('div');
    messageDiv.className = `chat-message-item ${message.is_from_customer ? 'customer' : 'admin'}`;
    
    const bubble = document.createElement('div');
    bubble.className = 'chat-message-bubble';
    bubble.textContent = message.text;
    
    const time = document.createElement('div');
    time.className = 'chat-message-time';
    time.textContent = message.timestamp;
    
    messageDiv.appendChild(bubble);
    messageDiv.appendChild(time);
    container.appendChild(messageDiv);
    
    // Auto-scroll to bottom if requested
    if (autoScroll) {
        container.scrollTop = container.scrollHeight;
    }
}

// Get CSRF token from cookie
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
