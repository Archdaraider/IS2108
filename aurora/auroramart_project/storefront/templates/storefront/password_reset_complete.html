{% extends 'storefront/base.html' %}
{% load static %}

{% block title %}Password Reset Complete - AuroraMart{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-modal">
        <div class="auth-header">
            <h2>Password Reset Complete</h2>
            <p>Your password has been successfully reset.</p>
        </div>

        <div class="auth-content">
            <div style="text-align: center; padding: 2rem 0;">
                <i class="fas fa-check-circle" style="font-size: 3rem; color: #28a745; margin-bottom: 1rem;"></i>
                <p style="color: #6e6e73; margin-bottom: 2rem;">
                    You can now log in with your new password.
                </p>
            </div>

            <div class="auth-links" style="text-align: center;">
                <a href="{% url 'login' %}" class="btn btn-primary auth-submit" style="display: inline-block; text-decoration: none; width: 100%;">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
